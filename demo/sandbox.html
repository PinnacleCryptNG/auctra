<title>Auctra Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  #boot { min-height: 100dvh; display: grid; place-items: center; padding-inline: 16px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
